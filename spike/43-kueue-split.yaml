apiVersion: v1
kind: Namespace
metadata:
  name: lr-smoke-queued
  labels: {opendatahub.io/dashboard: "true", kueue.openshift.io/managed: "true", loaded-rhoai.io/managed: "true"}
  annotations: {openshift.io/display-name: "LR Smoke (queued)", openshift.io/description: "Kueue-managed distributed workloads"}
---
apiVersion: kueue.x-k8s.io/v1beta2
kind: LocalQueue
metadata: {name: team-queue, namespace: lr-smoke-queued}
spec: {clusterQueue: lr-smoke-cq}
---
apiVersion: trainer.kubeflow.org/v1alpha1
kind: TrainJob
metadata:
  name: train-smoke
  namespace: lr-smoke-queued
  labels: {kueue.x-k8s.io/queue-name: team-queue}
spec:
  runtimeRef: {name: torch-distributed-cpu}
  trainer:
    numNodes: 1
    command: [python, -c, "import torch; print('torch', torch.__version__); x=torch.ones(4,4); print('sum', x.sum().item())"]
    resourcesPerNode: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "1", memory: 2Gi}}
---
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: ray-smoke
  namespace: lr-smoke-queued
  labels: {kueue.x-k8s.io/queue-name: team-queue}
spec:
  rayVersion: "2.47.1"
  headGroupSpec:
    rayStartParams: {dashboard-host: "0.0.0.0"}
    template:
      spec:
        containers:
        - name: ray-head
          image: quay.io/modh/ray@sha256:0d715f92570a2997381b7cafc0e224cfa25323f18b9545acfd23bc2b71576d06
          ports: [{containerPort: 6379, name: gcs-server}, {containerPort: 8265, name: dashboard}, {containerPort: 10001, name: client}]
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "1", memory: 2Gi}}
  workerGroupSpecs:
  - groupName: small
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    rayStartParams: {}
    template:
      spec:
        containers:
        - name: ray-worker
          image: quay.io/modh/ray@sha256:0d715f92570a2997381b7cafc0e224cfa25323f18b9545acfd23bc2b71576d06
          resources: {requests: {cpu: "1", memory: 2Gi}, limits: {cpu: "1", memory: 2Gi}}
