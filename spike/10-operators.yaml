# Dependency operators for RHOAI 3.5.2. The RHOAI Subscription is in 20-rhoai-operator.yaml,
# so RHCL exists before KServe starts (PLAN.md §7 item 4).
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata: {name: rhcl-operator, namespace: openshift-operators}
spec: {channel: stable, installPlanApproval: Automatic, name: rhcl-operator, source: redhat-operators, sourceNamespace: openshift-marketplace}
---
apiVersion: v1
kind: Namespace
metadata: {name: openshift-lws-operator, labels: {openshift.io/cluster-monitoring: "true"}}
---
apiVersion: operators.coreos.com/v1
kind: OperatorGroup
metadata: {name: leader-worker-set, namespace: openshift-lws-operator}
spec: {targetNamespaces: [openshift-lws-operator]}
---
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata: {name: leader-worker-set, namespace: openshift-lws-operator}
