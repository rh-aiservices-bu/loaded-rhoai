# MCP Gateway (PLAN.md §6, §17 item 26): preview channel only on 3.5.2, v1alpha1 APIs. Installed for
# all namespaces so MCPServerRegistrations can live next to their MCP servers in team projects.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata: {name: mcp-gateway, namespace: openshift-operators}
spec: {channel: preview, installPlanApproval: Automatic, name: mcp-gateway, source: redhat-operators, sourceNamespace: openshift-marketplace}
