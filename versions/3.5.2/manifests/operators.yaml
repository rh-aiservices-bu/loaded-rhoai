# Dependency operators for RHOAI 3.5.2. The RHOAI Subscription is in rhoai-subscription.yaml and
# is applied after these, so RHCL exists before KServe starts (PLAN.md §7 item 4).
# Approval is Automatic during install; phase 90 switches every Subscription to Manual.
apiVersion: operators.coreos.com/v1alpha1
kind: Subscription
metadata: {name: rhcl-operator, namespace: openshift-operators}
spec:
  channel: stable
  installPlanApproval: Automatic
  name: rhcl-operator
  source: redhat-operators
  sourceNamespace: openshift-marketplace
  config:
    # kuadrant-operator OOMKilled at 300Mi and again at 1Gi at ~355 projects (PLAN.md §4).
    resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {cpu: "2", memory: 3Gi}}
    # Guide Issue 7, confirmed on 3.5.2: without it maaspal load_test saw 55.7% errors.
    env: [{name: AUTH_SERVICE_TIMEOUT, value: 2s}]
---
apiVersion: v1
kind: Namespace
metadata: {name: openshift-lws-operator, labels: {openshift.io/cluster-monitoring: "true"}}
---
apiVersion: operators.coreos.com/v1
