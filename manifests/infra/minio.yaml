apiVersion: v1
kind: Namespace
metadata: {name: lr-infra, labels: {loaded-rhoai.io/managed: "true"}}
---
apiVersion: v1
kind: Secret
metadata: {name: minio-creds, namespace: lr-infra}
stringData: {accesskey: lrminio, secretkey: lrminio-spike-only}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: minio-data, namespace: lr-infra}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 50Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: minio, namespace: lr-infra}
spec:
  replicas: 1
  selector: {matchLabels: {app: minio}}
  strategy: {type: Recreate}
  template:
    metadata: {labels: {app: minio}}
    spec:
      containers:
      - name: minio
        image: quay.io/rh-aiservices-bu/minio:RELEASE.2025-09-07T16-13-09Z
        args: [server, /data, --console-address, ":9001"]
        env:
        - {name: MINIO_ROOT_USER, valueFrom: {secretKeyRef: {name: minio-creds, key: accesskey}}}
        - {name: MINIO_ROOT_PASSWORD, valueFrom: {secretKeyRef: {name: minio-creds, key: secretkey}}}
        - {name: HOME, value: /tmp}
        ports: [{containerPort: 9000}]
        readinessProbe: {httpGet: {path: /minio/health/ready, port: 9000}}
        resources: {requests: {cpu: 100m, memory: 512Mi}, limits: {memory: 2Gi}}
        volumeMounts: [{name: data, mountPath: /data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: minio-data}}]
---
apiVersion: v1
kind: Service
metadata: {name: minio, namespace: lr-infra}
spec: {selector: {app: minio}, ports: [{name: s3, port: 9000}]}
